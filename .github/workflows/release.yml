name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Read the version from the manifest
        run: echo "VERSION=$(jq -r .version manifest.json)" >> "$GITHUB_ENV"
      - name: Skip when this version is already released
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.SKIP != 'true'
        uses: cachix/install-nix-action@v31.11.1
      - if: env.SKIP != 'true'
        run: nix develop --command just lint
      - if: env.SKIP != 'true'
        run: nix develop --command just test all
      - if: env.SKIP != 'true'
        run: nix develop --command just build all
      - name: Publish the release
        if: env.SKIP != 'true'
        run: >-
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          apps/workout-tracker/dist/main.js
          apps/workout-tracker/dist/manifest.json
          apps/workout-tracker/dist/styles.css
        env:
          GH_TOKEN: ${{ github.token }}
