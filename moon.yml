$schema: 'https://moonrepo.dev/schemas/v2/project.json'

layer: 'configuration'

tasks:
  format:
    command: 'alejandra .'
    toolchains: 'system'
    deps:
      - 'format-markdown'
    inputs:
      - '**/*.nix'
    options:
      runFromWorkspaceRoot: true

  format-markdown:
    command: 'rumdl check --fix .'
    toolchains: 'system'
    inputs:
      - '**/*.md'
    options:
      runFromWorkspaceRoot: true

  lint-dependencies:
    command: 'pnpm exec depcruise apps libs --config .dependency-cruiser.cjs'
    toolchains: 'system'
    deps:
      - 'install'
    inputs:
      - 'apps/*/src/**/*'
      - 'libs/*/src/**/*'
      - 'libs/*/tests/**/*'
      - 'apps/*/package.json'
      - 'libs/*/package.json'
      - '.dependency-cruiser.cjs'
      - 'config/dependency-cruiser.base.cjs'
    options:
      runFromWorkspaceRoot: true

  lint:
    script: 'rumdl check . && alejandra --check .'
    toolchains: 'system'
    deps:
      - 'lint-dependencies'
    inputs:
      - '**/*.md'
      - '**/*.nix'
    options:
      runFromWorkspaceRoot: true

  install:
    command: 'pnpm install'
    toolchains: 'system'
    inputs:
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'apps/*/package.json'
      - 'libs/*/package.json'
    options:
      runFromWorkspaceRoot: true
